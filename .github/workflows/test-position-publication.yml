name: Test Position Publication Safety

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/verified_player_ids_2027.csv'
      - 'docs/leaguewide-identity-review-attestation-2027.md'
      - 'scripts/publish_verified_positions.py'
      - 'tests/test_position_publication.py'
      - '.github/workflows/test-position-publication.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: pip install "duckdb>=1.3,<2"
      - name: Verify publication safeguards
        run: python -m unittest discover -s tests -p "test_position_publication.py" -v
      - name: Validate staged crosswalk and prevent premature publication
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path("data/verified_player_ids_2027.csv").open(newline="", encoding="utf-8")))
          import sys
          sys.path.insert(0, "scripts")
          from publish_verified_positions import validate_crosswalk_source, validate_independent_evidence, POSITIONS
          assert rows, "Crosswalk must not be empty"
          verified = [r for r in rows if r["verified"].strip().lower() == "true"]
          print(f"Crosswalk entries: {len(rows)}; verified flags: {len(verified)}")
          assert len({r["nba_player_id"] for r in verified}) == len(verified), "Duplicate NBA IDs"
          assert len({r["bref_id"] for r in verified}) == len(verified), "Duplicate BRef IDs"
          for row in verified:
              assert row["nba_player_id"].isdigit(), "Invalid NBA ID"
              assert row["position"] in POSITIONS, "Invalid approved position"
              validate_crosswalk_source(row["verification_source"])
              validate_independent_evidence(row)
              assert row["reviewed_by"] == "eec757", "Unexpected reviewer"
              assert row["reviewed_on"] == "2026-10-24", "Unexpected review date"
          assert all(r["verified"].strip().lower() in {"true","false"} for r in rows), "Invalid approval flag"
          assert not Path("data/position_defense_2027.json").exists(), "Unverified output must not be committed"
          PY
