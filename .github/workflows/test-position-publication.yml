name: Test Position Publication Safety

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/verified_player_ids_2027.csv'
      - 'scripts/publish_verified_positions.py'
      - 'tests/test_position_publication.py'
      - '.github/workflows/test-position-publication.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: pip install "duckdb>=1.3,<2"
      - name: Verify publication safeguards
        run: python -m unittest discover -s tests -p "test_position_publication.py" -v
      - name: Validate staged crosswalk and prevent premature publication
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.DictReader(Path("data/verified_player_ids_2027.csv").open(newline="", encoding="utf-8")))
          expected = {"1631096", "1631114", "1641717", "1642349"}
          staged = {r["nba_player_id"] for r in rows if r["nba_player_id"] in expected}
          assert staged == expected, f"Missing staged players: {expected - staged}"
          verified = [r for r in rows if r["verified"].strip().lower() == "true"]
          print(f"Crosswalk entries: {len(rows)}; verified flags: {len(verified)}; staged OKC players: {len(staged)}")
          assert not verified, "Unexpected verified flag requires review"
          assert not Path("data/position_defense_2027.json").exists(), "Unverified output must not be committed"
          PY
