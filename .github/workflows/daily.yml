
name: Daily NBA Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update NBA statistics
        run: python scripts/collect.py

      - name: Probe player-level position data (non-blocking)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          pip install "duckdb>=1.3,<2"
          python scripts/probe_position.py
      - name: Validate 2026-27 roster positions (non-blocking)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/probe_rosters_2027.py
      - name: Test Basketball-Reference 2026-27 roster (non-blocking)
        continue-on-error: true
        timeout-minutes: 2
        run: python scripts/probe_bref_2027.py
      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.json
          git diff --cached --quiet || (git commit -m "Update NBA statistics" && git push)
