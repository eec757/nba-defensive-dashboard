name: Validate All NBA Rosters

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Validate Oklahoma City player ID matching
        run: |
          pip install "duckdb>=1.3,<2"
          python scripts/probe_bref_matching.py
      - name: Validate all 30 team rosters
        run: python scripts/probe_bref_league.py
