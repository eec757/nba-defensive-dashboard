name: Diagnose Real NBA Game Logs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose_real_game_logs.py'
      - '.github/workflows/diagnose-real-game-logs.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only database dependency
        run: pip install "duckdb>=1.3,<2"
      - name: Inspect real 2026-27 game logs without publishing
        run: python scripts/diagnose_real_game_logs.py
