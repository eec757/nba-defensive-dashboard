name: Publish Verified Position Defense

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "duckdb>=1.3,<2"
      - name: Require complete reference game in upstream source before publication
        run: |
          python scripts/audit_source_freshness_2027.py
          python scripts/audit_source_readiness_2027.py
          python - <<'PY'
          import json
          from pathlib import Path
          readiness=json.loads(Path("reports/2027_source_readiness.json").read_text())
          if readiness.get("source_reference_freshness_pass") is not True:
              raise SystemExit("Publication blocked: upstream game-log snapshot missing completed Phoenix reference game")
          print("Reference freshness passed; independent identity and 95% coverage gates still apply")
          PY
      - name: Test publication safety without external data
        run: python -m unittest discover -s tests -p "test_position_publication.py" -v
      - name: Remove stale position output before validation
        run: rm -f data/position_defense_2027.json
      - name: Publish only with verified ID evidence and 95 percent coverage
        run: python scripts/publish_verified_positions.py
      - name: Commit verified output if created
        run: |
          if [ -f data/position_defense_2027.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/position_defense_2027.json
            git diff --cached --quiet || (git commit -m "Publish verified opponent-position defensive stats" && git push)
          fi
