name: Combined Player Identity Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/combined-player-identity-audit.yml'
      - 'scripts/diagnose_real_game_logs.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests "duckdb>=1.3,<2"
      - name: Generate roster-matching candidates
        run: python scripts/audit_league_matching.py
      - name: Require generated roster report
        run: test -s reports/player_matching_2027.csv
      - name: Compare roster candidates to real game logs
        run: python scripts/diagnose_real_game_logs.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-player-identity-audit-2027
          path: reports/
          if-no-files-found: warn
