name: Combined Player Identity Audit

on:
  workflow_dispatch:
  push:
    branches: [main, review/approved-2027-crosswalk]
    paths:
      - '.github/workflows/combined-player-identity-audit.yml'
      - 'scripts/diagnose_real_game_logs.py'
      - 'scripts/build_identity_review_queue.py'
      - 'scripts/stage_wikidata_exact_evidence.py'
      - 'scripts/propose_verified_identity_crosswalk.py'
      - 'scripts/audit_season_position_evidence.py'
      - 'scripts/audit_position_game_coverage.py'
      - 'scripts/audit_proposed_game_coverage.py'
      - 'scripts/audit_unmatched_player_games.py'
      - 'scripts/trace_phoenix_opponent_positions.py'
      - 'scripts/audit_source_freshness_2027.py'
      - 'scripts/audit_source_readiness_2027.py'
      - 'scripts/audit_upstream_catalog_metadata_2027.py'
      - 'scripts/prioritize_identity_review_2027.py'
      - 'scripts/summarize_team_position_blockers_2027.py'
      - 'scripts/build_supported_identity_review_queue_2027.py'
      - 'scripts/display_exclusions_2027.py'
      - 'tests/test_display_exclusions_2027.py'
      - 'tests/test_source_readiness_2027.py'
      - 'scripts/build_targeted_coverage_exceptions.py'
      - 'scripts/validate_targeted_identity_review.py'
      - 'tests/test_targeted_identity_review.py'
      - 'scripts/stage_missing_game_log_identity_evidence.py'
      - 'scripts/audit_targeted_candidate_propagation.py'
      - 'scripts/audit_official_nba_evidence_propagation.py'
      - 'scripts/audit_diallo_evidence_readiness.py'
      - 'reports/2027_diallo_sg_position_evidence.csv'
      - 'scripts/audit_missing_player_positions.py'
      - 'scripts/audit_missing_player_coverage_scenario.py'
      - 'scripts/audit_remaining_game_log_exceptions.py'
      - 'scripts/audit_unresolved_player_team_context.py'
      - 'tests/test_wikidata_evidence_staging.py'
      - 'tests/test_identity_proposal_safety.py'
      - 'tests/test_human_identity_review_packet.py'
      - 'scripts/propose_verified_identity_crosswalk.py'
      - 'scripts/audit_identity_approval_readiness.py'
      - 'scripts/build_human_identity_review_packet.py'
      - 'scripts/stage_human_attested_crosswalk.py'
      - 'docs/leaguewide-review-confirmation-2027.md'
      - 'scripts/audit_wikidata_identity_statements.py'
      - 'reports/2027_targeted_identity_evidence_reconstruction.csv'
      - 'reports/2027_three_player_independent_corroboration.csv'
      - 'reports/2027_official_nba_identity_evidence.csv'
      - 'data/verified_player_ids_2027.csv'
      - 'data/reviewed_player_ids_2027.txt'
      - 'docs/leaguewide-identity-review-attestation-2027.md'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pytz "duckdb>=1.3,<2"
      - name: Generate roster-matching candidates
        run: python scripts/audit_league_matching.py
      - name: Require generated roster report
        run: test -s reports/player_matching_2027.csv
      - name: Build leaguewide unapproved identity review queue
        run: python scripts/build_identity_review_queue.py
      - name: Stage exact Wikidata identity evidence and exceptions
        run: python scripts/stage_wikidata_exact_evidence.py
      - name: Prepare unapproved identity crosswalk candidates
        run: python scripts/propose_verified_identity_crosswalk.py
      - name: Audit season-specific player positions from roster pages
        run: python scripts/audit_season_position_evidence.py
      - name: Stage human-attested crosswalk for validation only
        run: python scripts/stage_human_attested_crosswalk.py
      - name: Generate unapproved human identity review packet
        run: python scripts/build_human_identity_review_packet.py
      - name: Report position game coverage readiness without assuming verification
        run: python scripts/audit_position_game_coverage.py
      - name: Measure actual proposed player-game coverage by defending team and position
        run: python scripts/audit_proposed_game_coverage.py
      - name: Check 2027 game-log source freshness against completed Phoenix reference game
        run: python scripts/audit_source_freshness_2027.py
      - name: Evaluate source freshness readiness without publishing
        run: python scripts/audit_source_readiness_2027.py
      - name: Test display exclusions preserve coverage denominators
        run: python -m unittest discover -s tests -p 'test_display_exclusions_2027.py' -v
      - name: Test source freshness readiness fails closed
        run: python -m unittest discover -s tests -p 'test_source_readiness_2027.py' -v
      - name: Inspect upstream catalog metadata for refresh provenance (read-only)
        run: python scripts/audit_upstream_catalog_metadata_2027.py
      - name: Rehearse publication freshness prerequisite (read-only)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("reports/2027_source_readiness.json").read_text())
          blocked=report.get("source_reference_freshness_pass") is not True
          print("PUBLICATION_PREFLIGHT_SOURCE_BLOCKED",blocked)
          assert report.get("publication_ready") is False
          PY
      - name: Trace Phoenix opposing player-game positions to source game IDs
        run: python scripts/trace_phoenix_opponent_positions.py
      - name: Identify unmatched player-game identities for independent review
        run: python scripts/audit_unmatched_player_games.py
      - name: Prioritize unmatched player IDs for independent review
        run: python scripts/prioritize_identity_review_2027.py
      - name: Generate targeted coverage exceptions for review
        run: python scripts/build_targeted_coverage_exceptions.py
      - name: Stage independent identity candidates for game-log-only players
        run: python scripts/stage_missing_game_log_identity_evidence.py
      - name: Verify official NBA evidence reached generated game-log staging
        run: python scripts/audit_official_nba_evidence_propagation.py
      - name: Report Diallo exact-link and season-position evidence readiness
        run: python scripts/audit_diallo_evidence_readiness.py
      - name: Compare reviewed candidate IDs against generated game-log staging
        run: python scripts/audit_targeted_candidate_propagation.py
      - name: Audit season positions for unmatched identity candidates
        run: python scripts/audit_missing_player_positions.py
      - name: Calculate strict hypothetical coverage with supported missing-player evidence
        run: python scripts/audit_missing_player_coverage_scenario.py
      - name: Report exact unresolved game-log identity and position blockers
        run: python scripts/audit_remaining_game_log_exceptions.py
      - name: Build pending independently supported identity review queue
        run: python scripts/build_supported_identity_review_queue_2027.py
      - name: Summarize strict team-position publication blockers
        run: python scripts/summarize_team_position_blockers_2027.py
      - name: Identify actual team affiliations for unresolved player-game IDs
        run: python scripts/audit_unresolved_player_team_context.py
      - name: Test evidence matching safety
        if: always()
        run: python -m unittest discover -s tests -p 'test_wikidata_evidence_staging.py' -v
      - name: Test proposal cannot synthesize human approval
        if: always()
        run: python -m unittest discover -s tests -p 'test_identity_proposal_safety.py' -v
      - name: Test review packet never grants approval
        if: always()
        run: python -m unittest discover -s tests -p 'test_human_identity_review_packet.py' -v
      - name: Check manually reviewed exception candidates remain pending
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('reports/2027_targeted_identity_evidence_reconstruction.csv')
          rows=list(csv.DictReader(p.open()))
          assert len(rows)==11 and len({r['nba_player_id'] for r in rows})==11
          assert all(r['manual_review_reported']=='yes' and r['approval_status']=='pending' for r in rows)
          assert all(r['candidate_bref_id'] and r['candidate_position'] in ('PG','SG','SF','PF','C') for r in rows)
          by_id={r['nba_player_id']:r for r in rows}
          assert by_id['1643633']['candidate_position']=='PF'
          assert by_id['1643568']['candidate_position']=='SF'
          assert by_id['1643813']['candidate_position']=='SG'
          assert by_id['1643813']['candidate_bref_id']=='diallal01'
          print('11 candidates structurally complete; 0 approved. Independent evidence validation still required.')
          PY
      - name: Test targeted identity review safety
        if: always()
        run: python -m unittest discover -s tests -p 'test_targeted_identity_review.py' -v
      - name: Compare roster candidates to real game logs
        run: python scripts/diagnose_real_game_logs.py
      - name: Generate identity approval readiness report
        if: always()
        run: python scripts/audit_identity_approval_readiness.py
      - name: Validate Wikidata identity statements
        if: always()
        run: python scripts/audit_wikidata_identity_statements.py
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combined-player-identity-audit-2027
          path: reports/
          if-no-files-found: warn
