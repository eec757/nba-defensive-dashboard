<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NBA Defensive Dashboard</title><style>body{margin:0;padding:28px;background:#101827;color:#edf4ff;font:16px system-ui}main{max-width:1100px;margin:auto}h1{margin-bottom:4px}.muted{color:#aebbd0}.panel{background:#1b2a41;border-radius:14px;padding:20px;margin:20px 0}select{padding:9px;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #354760}th{color:#91c8ff}.scroll{overflow:auto}.warning{color:#ffd29a}</style></head><body><main><h1>NBA Defensive Analytics</h1><p class="muted">Team scoring and points allowed · Seasons kept separate</p><div class="panel"><label>Season <select id="season"><option>2026-27</option><option>2025-26</option></select></label><p id="status" class="muted">Loading…</p></div><div class="panel scroll"><table><thead><tr><th>Team</th><th>GP</th><th>PPG</th><th>Scoring rank</th><th>Allowed PPG</th><th>Defense rank</th><th>Data quality</th></tr></thead><tbody id="rows"></tbody></table></div><div class="panel"><h2>Additional defensive splits</h2><p class="warning">Position, three-point, paint and rim splits are not yet connected. No estimated values are shown.</p></div></main><script>let data;const season=document.getElementById('season'),rows=document.getElementById('rows'),status=document.getElementById('status');function render(){const s=data?.seasons?.[season.value];rows.replaceChildren();if(!s?.teams?.length){status.textContent='No data yet. Run the GitHub Actions workflow and check its logs.';return}status.textContent=`Updated ${data.updated_at} · ${s.games} completed games · ${s.teams.length} teams`;for(const t of s.teams){const tr=document.createElement('tr');for(const k of ['team','gp','ppg','scoring_rank','opp_ppg','defense_rank','quality']){const td=document.createElement('td');td.textContent=t[k]??'Unavailable';tr.appendChild(td)}rows.appendChild(tr)}}season.addEventListener('change',render);fetch('./data/summary.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Unavailable');return r.json()}).then(d=>{data=d;render()}).catch(()=>status.textContent='Data unavailable. View via GitHub Pages, not by opening this HTML file locally.');</script></body></html>
